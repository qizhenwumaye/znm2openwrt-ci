name: IPQ60XX-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/AnClark/lede-zn-m2-wifi.git
      repo_branch: zn-m2-wifi
      config_file: configs/IPQ60XX.config
      firmware_tag: IPQ60XX-LEDE
      kernel_file: kernel-6.12
      artifact_prefix: IPQ60XX-LEDE
      manifest_file: openwrt-qualcommax-ipq60xx.manifest
      release_summary: >-
        这是基于 AnClark 适配修复 WiFi 内存模式的 Lean LEDE 固件，针对兆能 ZN-M2 (和目 CMIOT AX18) 优化。
